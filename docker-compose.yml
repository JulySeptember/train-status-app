services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: train-status-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:8080
    command: npm run dev -- --host
    stdin_open: true
    tty: true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: train-status-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    # ODPT のキーなど（gitignore 済み。無くても起動する）
    env_file:
      - path: ./backend/.env
        required: false
    # Google でのログイン。クライアント ID は秘密の値ではない（infra/env/dev.tfvars と同じ）
    environment:
      # 他社の事業者の一覧は make up が infra/env/dev.tfvars から渡す（backend/.env が無ければ空）
      ODPT_OPERATORS: ${ODPT_OPERATORS:-}
      GOOGLE_CLIENT_ID: 401009185515-et7htndp1m7733fq2itm5muptg0it6uq.apps.googleusercontent.com
    command: go run ./cmd/api
    stdin_open: true
    tty: true
