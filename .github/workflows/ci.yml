name: CI

# PR では検証と terraform plan、main への push では検証のあとにデプロイ（deploy.yml）する。
# workflow_dispatch（main で手動実行）は、変更の有無にかかわらず全領域を検証・デプロイする。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  AWS_REGION: ap-northeast-1
  # ロールは infra/bootstrap/github_oidc.tf で作っている。ARN は秘密の値ではない
  AWS_PLAN_ROLE_ARN: arn:aws:iam::015060879504:role/train-status-app-dev-github-plan
  # deploy.yml の TERRAFORM_VERSION と合わせる
  TERRAFORM_VERSION: 1.15.7
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  # プロバイダをここに置き、.terraform.lock.hcl ごとに actions/cache で使い回す
  TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache

# main ではデプロイを途中で止めないように、実行中のものは取り消さない
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 変更のあったディレクトリだけジョブを実行する。
  # ワークフロー単位の paths で絞ると、必須チェックが「待機中」のまま残るため、ジョブ単位で判定する。
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend }}
      infra: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'frontend/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy.yml'
            infra:
              - 'infra/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt が必要なファイル:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # swag の CLI は go.mod のライブラリと同じバージョンを使う
      - name: Swagger が最新か確認
        run: |
          version="$(go list -m -f '{{.Version}}' github.com/swaggo/swag)"
          go install "github.com/swaggo/swag/cmd/swag@${version}"
          swag init -g cmd/api/main.go -o docs
          git diff --exit-code -- docs || {
            echo "backend/docs が古くなっています。swag init -g cmd/api/main.go -o docs を実行してください。"
            exit 1
          }

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # E2E テスト。/api はテストの中でモックするので、バックエンドは起動しない
      # ブラウザ（~/.cache/ms-playwright）は Playwright のバージョンごとにキャッシュする。
      # 当たったときは、キャッシュに入らない OS のパッケージだけを入れる
      - name: Playwright のバージョンを調べる
        id: playwright
        run: |
          version="$(npx playwright --version | awk '{print $2}')"
          if [ -z "$version" ]; then
            echo "Playwright のバージョンを取得できませんでした"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          # ImageOS（ubuntu24 など）を入れ、ランナーの OS が変わったら入れ直す
          key: playwright-${{ env.ImageOS }}-${{ steps.playwright.outputs.version }}-chromium

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: プロバイダのキャッシュのディレクトリを作る
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('infra/**/.terraform.lock.hcl') }}

      - name: terraform fmt
        run: terraform fmt -check -recursive infra

      # AWS の認証情報は使わない（backend を無効にして構文と参照だけを検証する）
      - name: terraform validate
        run: |
          for dir in infra/bootstrap infra/main; do
            echo "::group::${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false
            terraform -chdir="${dir}" validate
            echo "::endgroup::"
          done

  # PR に terraform plan の結果をコメントする（同じコメントを更新する）。
  # plan 用のロールは読み取り専用なので、ロックは取らない。
  # フォークからの PR には ID トークンが発行されず、ロールを使えないので実行しない。
  # 依存の更新（Dependabot）の PR でも AWS のロールは使わない（手元で make tf-main-plan を実行して確かめる。infra/CLAUDE.md）。
  infra-plan:
    needs: [changes, infra]
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.infra == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: プロバイダのキャッシュのディレクトリを作る
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('infra/**/.terraform.lock.hcl') }}

      - name: terraform plan
        id: plan
        run: |
          terraform -chdir=infra/main init -input=false
          set +e
          terraform -chdir=infra/main plan -input=false -lock=false -no-color \
            -var-file=../env/dev.tfvars > plan.txt 2>&1
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          cat plan.txt

      - name: plan の結果を PR にコメントする
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
        run: |
          marker='<!-- terraform-plan -->'
          if [ "$EXITCODE" = 0 ]; then
            summary="$(grep -E '^(Plan:|No changes\.)' plan.txt || true)"
          else
            summary='plan に失敗しました'
          fi
          {
            echo "$marker"
            echo "### terraform plan（infra/main）"
            echo
            echo "**${summary}**（${{ github.event.pull_request.head.sha }}）"
            echo
            echo '<details><summary>詳細</summary>'
            echo
            echo '```'
            # コメントの上限（65,536文字）を超えないように切り詰める
            head -c 60000 plan.txt
            echo
            echo '```'
            echo '</details>'
          } > comment.md

          id="$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"${marker}\"))][0].id // empty" | head -n1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${id}" -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" -F body=@comment.md > /dev/null
          fi
          exit "$EXITCODE"

  # main への push（マージ）で、検証のジョブが1つも失敗していなければデプロイする（deploy.yml）
  deploy:
    needs: [changes, backend, frontend, infra]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      (needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.infra == 'true')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      backend: ${{ needs.changes.outputs.backend == 'true' }}
      frontend: ${{ needs.changes.outputs.frontend == 'true' }}
      infra: ${{ needs.changes.outputs.infra == 'true' }}
