# JR 新宿駅の対応表（docs/design/station-guide.md 5章）。
#
# 番線と路線・方向は、Wikipedia「新宿駅」ののりばの表（JR東日本の駅構内図が出典）による。
# 区画と番線の対応は、OpenStreetMap のホームの位置と番線（ref）で照らした（13〜16番線は OSM に番線が無く、並びから決めた）。
# 改札の位置は、構内地図の改札機（造作 C202）の固まりの中心で、名前は OpenStreetMap の改札と照らした。
# 階（floor）は歩行空間ネットワークの階（構内地図の階の番号とは合っていない）。
# 2026-10-28 に作成。

# ZIP のファイル名の <駅>（jrc_nwd_<駅>_geojson.zip）
name: shinjuku

stations:
  - odpt.Station:JR-East.Yamanote.Shinjuku
  - odpt.Station:JR-East.ChuoRapid.Shinjuku
  - odpt.Station:JR-East.ChuoSobuLocal.Shinjuku
  - odpt.Station:JR-East.SaikyoKawagoe.Shinjuku
  - odpt.Station:JR-East.ShonanShinjuku.Shinjuku

# ホームの区画（構内地図の Space B028）。東から西へ番線が大きくなる。
# 5・6番線（特急）と 9・10番線（中央本線の特急）は、経路検索に特急が無いので路線を書かない。
platforms:
  - space: f65ae2622bf04af08c73c16120bdb7bc
    floor: 1
    sides:
      - track: "1・2"
        railway: odpt.Railway:JR-East.SaikyoKawagoe
        direction: odpt.RailDirection:Southbound
      - track: "1"
        railway: odpt.Railway:JR-East.ShonanShinjuku
        direction: odpt.RailDirection:Southbound
  - space: 691de804e1f74235b491baa17c188888
    floor: 1
    sides:
      - track: "3・4"
        railway: odpt.Railway:JR-East.SaikyoKawagoe
        direction: odpt.RailDirection:Northbound
      - track: "4"
        railway: odpt.Railway:JR-East.ShonanShinjuku
        direction: odpt.RailDirection:Northbound
  - space: 5111a20ee4564600a2d7bde2bff3f56c
    floor: 1
    sides:
      - track: "7・8"
        railway: odpt.Railway:JR-East.ChuoRapid
        direction: odpt.RailDirection:Inbound
  - space: 3e51fb01ce5a41baac012ead61b6d7e2
    floor: 1
    sides:
      - track: "11・12"
        railway: odpt.Railway:JR-East.ChuoRapid
        direction: odpt.RailDirection:Outbound
  - space: 4d294ae877154ef4979533a99631e9fd
    floor: 1
    sides:
      - track: "13"
        railway: odpt.Railway:JR-East.ChuoSobuLocal
        direction: odpt.RailDirection:Eastbound
      - track: "14"
        railway: odpt.Railway:JR-East.Yamanote
        direction: odpt.RailDirection:InnerLoop
  - space: 7b350fafc6364bedacadcd684f3b43e1
    floor: 1
    sides:
      - track: "15"
        railway: odpt.Railway:JR-East.Yamanote
        direction: odpt.RailDirection:OuterLoop
      - track: "16"
        railway: odpt.Railway:JR-East.ChuoSobuLocal
        direction: odpt.RailDirection:Westbound

# 路線ごとの編成の両数（混ざる路線は長いほう）
cars:
  odpt.Railway:JR-East.Yamanote: 11
  odpt.Railway:JR-East.ChuoRapid: 12
  odpt.Railway:JR-East.ChuoSobuLocal: 10
  odpt.Railway:JR-East.SaikyoKawagoe: 10
  odpt.Railway:JR-East.ShonanShinjuku: 15

gates:
  - name: 東改札
    floor: -1
    lat: 35.69125
    lon: 139.70083
  - name: 中央東改札
    floor: -1
    lat: 35.69077
    lon: 139.70102
  - name: 西改札
    floor: -1
    lat: 35.69119
    lon: 139.70015
  - name: 中央西改札
    floor: -1
    lat: 35.69035
    lon: 139.69978
  - name: 南改札
    floor: 2
    lat: 35.68942
    lon: 139.70024
  - name: 小田急線乗換改札
    floor: 2
    lat: 35.68963
    lon: 139.70004
  - name: 東南改札
    floor: 2
    lat: 35.68966
    lon: 139.70132
  - name: 甲州街道改札
    floor: 2
    lat: 35.68880
    lon: 139.70078
  - name: 新南改札
    floor: 2
    lat: 35.68840
    lon: 139.70091
  - name: ミライナタワー改札
    floor: 2
    lat: 35.68869
    lon: 139.70143

# 乗り換え先の他社の駅 → 使う改札。書いていない駅は、駅の座標に最も近い改札にする
transfers:
  # 小田急の南口の乗換改札（JR の改札内から直接入れる）
  odpt.Station:Odakyu.Odawara.Shinjuku: 小田急線乗換改札
  # 京王線の京王百貨店口・JR 連絡口は中央西改札の隣
  odpt.Station:Keio.Keio.Shinjuku: 中央西改札
  # 京王新線・都営新宿線（新線新宿）は南改札が近い
  odpt.Station:Keio.KeioNew.Shinjuku: 南改札
  odpt.Station:Toei.Shinjuku.Shinjuku: 南改札
