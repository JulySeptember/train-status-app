basePath: /
definitions:
  ai.ChatMessage:
    properties:
      role:
        description: '"user" または "assistant"'
        type: string
      text:
        type: string
    type: object
  ai.ChatRequest:
    properties:
      messages:
        items:
          $ref: '#/definitions/ai.ChatMessage'
        type: array
    type: object
  ai.ChatResponse:
    properties:
      journeys:
        allOf:
        - $ref: '#/definitions/service.JourneySearch'
        description: 最後に探した経路（search_route の結果そのもの）。時刻などの事実を、AI の文章ではなくアプリのデータで表示するため
      reply:
        type: string
      steps:
        items:
          $ref: '#/definitions/ai.Step'
        type: array
    type: object
  ai.Step:
    properties:
      label:
        type: string
      tool:
        type: string
    type: object
  auth.User:
    properties:
      createdAt:
        type: string
    type: object
  favorite.Favorites:
    properties:
      journeys:
        items:
          $ref: '#/definitions/favorite.JourneyFavorite'
        type: array
      railways:
        items:
          type: string
        type: array
      stations:
        items:
          type: string
        type: array
    type: object
  favorite.JourneyFavorite:
    properties:
      from:
        type: string
      to:
        type: string
    type: object
  handler.AlertRequest:
    properties:
      days:
        items:
          $ref: '#/definitions/notify.Day'
        type: array
      end:
        type: string
      start:
        type: string
    type: object
  handler.AuthConfig:
    properties:
      googleClientId:
        type: string
    type: object
  handler.ChatError:
    properties:
      code:
        type: string
      error:
        type: string
    type: object
  handler.LoginRequest:
    properties:
      credential:
        type: string
    type: object
  handler.LoginResponse:
    properties:
      user:
        $ref: '#/definitions/auth.User'
    type: object
  handler.PushConfig:
    properties:
      publicKey:
        type: string
    type: object
  handler.TestResult:
    properties:
      sent:
        type: integer
    type: object
  handler.UnsubscribeRequest:
    properties:
      endpoint:
        type: string
    type: object
  notify.Alert:
    properties:
      days:
        items:
          $ref: '#/definitions/notify.Day'
        type: array
      end:
        type: string
      railwayId:
        type: string
      start:
        type: string
    type: object
  notify.Day:
    enum:
    - weekday
    - holiday
    type: string
    x-enum-comments:
      Holiday: 土休日
    x-enum-descriptions:
    - ""
    - 土休日
    x-enum-varnames:
    - Weekday
    - Holiday
  service.DirectionTimetable:
    properties:
      calendar:
        type: string
      isToday:
        description: 現在の運行日に適用されるダイヤか
        type: boolean
      railDirection:
        type: string
      timetables:
        items:
          $ref: '#/definitions/service.Timetable'
        type: array
    type: object
  service.Journey:
    properties:
      arrivalTime:
        type: string
      departureTime:
        type: string
      legs:
        items:
          $ref: '#/definitions/service.JourneyLeg'
        type: array
      transfers:
        type: integer
      walkAfterMinutes:
        description: 最後に降りる駅から到着駅まで歩く時間（分）
        type: integer
      walkBeforeMinutes:
        description: 出発駅から最初に乗る駅まで歩く時間（分）
        type: integer
    type: object
  service.JourneyLeg:
    properties:
      arrivalTime:
        type: string
      delayMinutes:
        description: 乗る駅での発車の遅れ（分）。時刻表の発車時刻は departureTime からこの分を引いた時刻
        type: integer
      departureTime:
        description: 遅れを足した時刻。遅れは路線・方向ごとの見込みで、現在から1時間以内の時刻にだけ足す
        type: string
      destination:
        description: 大江戸線の環状部などでは行先が無く、空になる
        type: string
      destinationName:
        type: string
      estimated:
        description: |-
          列車時刻表の無い事業者（東急・西武・小田急・京急・ゆりかもめ）の列車で、駅時刻表の発車をつないで
          推定したものか（docs/design/multi-operator.md 8章）。発車時刻は駅時刻表のとおりだが、どの発車が同じ列車かと
          終点の到着時刻は推定。trainNumber は空で、列車の位置は引けない
        type: boolean
      from:
        type: string
      fromName:
        type: string
      railway:
        type: string
      railwayName:
        type: string
      through:
        description: |-
          前の区間の列車から、直通運転で乗り続ける区間か（乗り換えではない。transfers に数えない）。
          列車は事業者ごとに分かれているので、train・trainNumber はこの区間の事業者の列車になる
        type: boolean
      to:
        type: string
      toName:
        type: string
      train:
        type: string
      trainNumber:
        type: string
      trainType:
        type: string
      trainTypeName:
        type: string
    type: object
  service.JourneySearch:
    properties:
      delayApplied:
        description: 遅れと運転見合わせを反映したか。運行状況を取得できなかったときは false で、時刻表どおりに探す
        type: boolean
      journeys:
        items:
          $ref: '#/definitions/service.Journey'
        type: array
      suspendedRailways:
        description: 運転を見合わせているため使わなかった路線
        items:
          $ref: '#/definitions/service.Railway'
        type: array
    type: object
  service.RailDirection:
    properties:
      id:
        description: '方向（例: odpt.RailDirection:Northbound）'
        type: string
      name:
        description: '日本語名（例: 北行、荻窪方面）'
        type: string
    type: object
  service.Railway:
    properties:
      color:
        type: string
      directions:
        description: 路線の方向（上り・下りの順）。駅の一覧で方向を選んでから時刻表を開くのに使う。GET /api/routes だけが返す
        items:
          $ref: '#/definitions/service.RailDirection'
        type: array
      id:
        type: string
      lineCode:
        description: |-
          路線記号（例: A）と路線の色（例: #FF535F）。GET /api/routes だけが返す。
          ODPT が配信していない路線では空になる
        type: string
      name:
        type: string
      operator:
        description: '事業者（例: odpt.Operator:Toei）と、その表示名（例: 都営交通）。GET /api/routes だけが返す'
        type: string
      operatorName:
        type: string
    type: object
  service.Station:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  service.StationDetail:
    properties:
      id:
        type: string
      name:
        type: string
      timetables:
        items:
          $ref: '#/definitions/service.DirectionTimetable'
        type: array
      trainLocationAvailable:
        description: この駅の路線で列車位置情報が配信されているか
        type: boolean
    type: object
  service.StationSummary:
    properties:
      id:
        type: string
      journeyStation:
        description: |-
          経路検索の選択肢として、この駅とまとめる駅の代表（journeyStations）。
          同じ名前で近くにある駅をつないだまとまりの中で、ID 順に最初の経路検索に使える駅。
          経路検索に使えない駅（列車時刻表の無い事業者の駅で、近くに同じ名前の駅も無いもの）では空になる
        type: string
      name:
        type: string
      railwayId:
        type: string
    type: object
  service.Timetable:
    properties:
      destination:
        type: string
      time:
        type: string
      trainId:
        type: string
      trainNumber:
        type: string
      trainType:
        type: string
      trainTypeId:
        description: '列車種別（例: 普通、急行、エアポート快特）'
        type: string
    type: object
  service.TrainLocation:
    properties:
      available:
        type: boolean
      delay:
        description: 遅れ（秒）。delayAvailable が false の路線（荒川線）では配信されず 0 になる
        type: integer
      delayAvailable:
        type: boolean
      destination:
        description: 行先の駅名。直通運転先（他社）の駅も含む
        type: string
      fromStation:
        type: string
      fromStationId:
        type: string
      message:
        type: string
      notRunning:
        description: |-
          available が false のとき、本日のダイヤから見た状態（beforeDeparture・finished・noData）。
          本日のダイヤに無い列車では空
        type: string
      railDirection:
        type: string
      railway:
        type: string
      railwayId:
        type: string
      scheduledStation:
        type: string
      scheduledStationId:
        description: notRunning が beforeDeparture・noData のときは出発する駅と時刻、finished のときは着いた駅と時刻
        type: string
      scheduledTime:
        type: string
      stopped:
        description: true の場合は fromStation に停車中（toStation は空）
        type: boolean
      toStation:
        type: string
      toStationId:
        type: string
      trainId:
        type: string
      trainNumber:
        type: string
      trainType:
        type: string
      trainTypeId:
        description: '列車種別（例: 普通、エアポート快特）'
        type: string
      updatedAt:
        description: 位置情報の配信時刻（ODPT の dc:date）
        type: string
    type: object
  service.TrainStatus:
    properties:
      railway:
        type: string
      railwayId:
        description: '路線ID（例: odpt.Railway:Toei.Asakusa）。フロントで路線一覧と並び順を揃えるのに使う'
        type: string
      status:
        type: string
      unavailable:
        description: 事業者の運行情報を取得できなかったときは true（status は「運行情報を取得できませんでした」）
        type: boolean
    type: object
  webpush.Subscription:
    properties:
      endpoint:
        type: string
      keys:
        properties:
          auth:
            type: string
          p256dh:
            type: string
        type: object
    type: object
info:
  contact: {}
  description: Tokyo railway status, timetable and journey API (ODPT open data)
  title: Train Status API
  version: "1.0"
paths:
  /api/auth/config:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AuthConfig'
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get login settings
      tags:
      - Auth
  /api/auth/google:
    post:
      consumes:
      - application/json
      description: Verifies the ID token from Google Identity Services and sets the
        session cookie.
      parameters:
      - description: ID token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log in with a Google ID token
      tags:
      - Auth
  /api/auth/logout:
    post:
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log out
      tags:
      - Auth
  /api/chat:
    post:
      consumes:
      - application/json
      description: |-
        AI エージェントに質問する。会話の履歴はブラウザが持ち、毎回送る（最後はユーザーの発言）。
        入力は AI の提供元（Google）に送信される。
      parameters:
      - description: Conversation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ai.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ai.ChatResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ChatError'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handler.ChatError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handler.ChatError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.ChatError'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/handler.ChatError'
      summary: Ask the AI agent
      tags:
      - Chat
  /api/journeys:
    get:
      description: |-
        Search journeys between two stations. Returns the earliest journey for each number of transfers, plus journeys on later trains (earlier trains with arriveBy), up to 4 in total.
        Journeys are sorted by arrival time (by departure time, latest first, with arriveBy).
        Stations with the same name on different lines (e.g. Shinjuku) are treated as one station.
        Times are on the current service day (before 03:00 belongs to the previous day).
        Current delays (per railway and direction, within the next hour) are added to the times, and suspended railways are avoided.
        If the realtime status cannot be fetched, the timetable is used as is and delayApplied is false.
        With realtime=false, delays and suspensions are ignored and the timetable is used as is.
      parameters:
      - description: From station ID
        example: odpt.Station:Toei.Mita.Kasuga
        in: query
        name: from
        required: true
        type: string
      - description: To station ID
        example: odpt.Station:Toei.Asakusa.Asakusa
        in: query
        name: to
        required: true
        type: string
      - description: Departure time (HH:MM). Defaults to now
        example: "10:00"
        in: query
        name: departAt
        type: string
      - description: Arrival time (HH:MM). Cannot be used with departAt
        in: query
        name: arriveBy
        type: string
      - default: 3
        description: Maximum number of transfers (0-3)
        in: query
        name: maxTransfers
        type: integer
      - description: Comma-separated railway IDs to avoid
        example: odpt.Railway:Toei.Oedo
        in: query
        name: avoid
        type: string
      - default: true
        description: Apply current delays and suspensions
        in: query
        name: realtime
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.JourneySearch'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Search journeys
      tags:
      - Journey
  /api/me:
    delete:
      description: Deletes all data of the logged-in user and the sessions.
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete the account
      tags:
      - Auth
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.User'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get the logged-in user
      tags:
      - Auth
  /api/me/alerts:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/notify.Alert'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get notification settings
      tags:
      - Notifications
  /api/me/alerts/{railwayId}:
    delete:
      parameters:
      - description: railway ID
        in: path
        name: railwayId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Remove the notification setting of a railway
      tags:
      - Notifications
    put:
      consumes:
      - application/json
      description: days are weekday and/or holiday. start and end are HH:MM in 30-minute
        steps (start <= now < end).
      parameters:
      - description: railway ID
        in: path
        name: railwayId
        required: true
        type: string
      - description: days and time window
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.AlertRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: limit reached
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Set the notification setting of a railway
      tags:
      - Notifications
  /api/me/favorites:
    get:
      description: Stations, railways and journeys the logged-in user registered,
        in the order added.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/favorite.Favorites'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get favorites
      tags:
      - Favorites
  /api/me/favorites/{kind}/{id}:
    delete:
      parameters:
      - description: stations, railways or journeys
        in: path
        name: kind
        required: true
        type: string
      - description: station ID, railway ID or <from>~<to>
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Remove a favorite
      tags:
      - Favorites
    put:
      description: kind is stations, railways or journeys. The id of a journey is
        "<from station ID>~<to station ID>".
      parameters:
      - description: stations, railways or journeys
        in: path
        name: kind
        required: true
        type: string
      - description: station ID, railway ID or <from>~<to>
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: limit reached
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add a favorite
      tags:
      - Favorites
  /api/me/push-subscriptions:
    delete:
      consumes:
      - application/json
      parameters:
      - description: endpoint of the subscription
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.UnsubscribeRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Stop push notifications on this device
      tags:
      - Notifications
    post:
      consumes:
      - application/json
      description: The body is PushSubscription.toJSON() of the browser. Only known
        push services are accepted.
      parameters:
      - description: push subscription
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/webpush.Subscription'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register this device for push notifications
      tags:
      - Notifications
  /api/me/push-subscriptions/test:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TestResult'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: no device
          schema:
            additionalProperties:
              type: string
