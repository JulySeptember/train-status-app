basePath: /
definitions:
  service.DirectionTimetable:
    properties:
      calendar:
        type: string
      isToday:
        description: 現在の運行日に適用されるダイヤか
        type: boolean
      railDirection:
        type: string
      timetables:
        items:
          $ref: '#/definitions/service.Timetable'
        type: array
    type: object
  service.Fare:
    properties:
      from:
        type: string
      icFare:
        type: integer
      ticketFare:
        type: integer
      to:
        type: string
    type: object
  service.Journey:
    properties:
      arrivalTime:
        type: string
      departureTime:
        type: string
      legs:
        items:
          $ref: '#/definitions/service.JourneyLeg'
        type: array
      transfers:
        type: integer
    type: object
  service.JourneyLeg:
    properties:
      arrivalTime:
        type: string
      departureTime:
        type: string
      destination:
        description: 大江戸線の環状部などでは行先が無く、空になる
        type: string
      destinationName:
        type: string
      from:
        type: string
      fromName:
        type: string
      railway:
        type: string
      railwayName:
        type: string
      to:
        type: string
      toName:
        type: string
      train:
        type: string
      trainNumber:
        type: string
      trainType:
        type: string
      trainTypeName:
        type: string
    type: object
  service.JourneySearch:
    properties:
      journeys:
        items:
          $ref: '#/definitions/service.Journey'
        type: array
    type: object
  service.Passenger:
    properties:
      count:
        type: integer
      year:
        type: integer
    type: object
  service.Railway:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  service.Station:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  service.StationDetail:
    properties:
      id:
        type: string
      name:
        type: string
      passengers:
        items:
          $ref: '#/definitions/service.Passenger'
        type: array
      timetables:
        items:
          $ref: '#/definitions/service.DirectionTimetable'
        type: array
      trainLocationAvailable:
        description: この駅の路線で列車位置情報が配信されているか
        type: boolean
    type: object
  service.Timetable:
    properties:
      destination:
        type: string
      time:
        type: string
      trainId:
        type: string
      trainNumber:
        type: string
      trainType:
        type: string
      trainTypeId:
        description: '列車種別（例: 普通、急行、エアポート快特）'
        type: string
    type: object
  service.TrainLocation:
    properties:
      available:
        type: boolean
      delay:
        type: integer
      fromStation:
        type: string
      message:
        type: string
      railway:
        type: string
      stopped:
        description: true の場合は fromStation に停車中（toStation は空）
        type: boolean
      toStation:
        type: string
      trainId:
        type: string
      trainNumber:
        type: string
    type: object
  service.TrainStatus:
    properties:
      railway:
        type: string
      status:
        type: string
    type: object
info:
  contact: {}
  description: Toei Transportation API
  title: Train Status API
  version: "1.0"
paths:
  /api/fares:
    get:
      description: Get IC card and ticket fare between two stations
      parameters:
      - description: From station ID
        example: odpt.Station:Toei.Oedo.Daimon
        in: query
        name: from
        required: true
        type: string
      - description: To station ID
        example: odpt.Station:Toei.Asakusa.Magome
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.Fare'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get fare
      tags:
      - Fare
  /api/journeys:
    get:
      description: |-
        Search journeys between two stations. Returns the earliest journey for each number of transfers.
        Stations with the same name on different lines (e.g. Shinjuku) are treated as one station.
        Times are on the current service day (before 03:00 belongs to the previous day).
      parameters:
      - description: From station ID
        example: odpt.Station:Toei.Mita.Kasuga
        in: query
        name: from
        required: true
        type: string
      - description: To station ID
        example: odpt.Station:Toei.Asakusa.Asakusa
        in: query
        name: to
        required: true
        type: string
      - description: Departure time (HH:MM). Defaults to now
        example: "10:00"
        in: query
        name: departAt
        type: string
      - description: Arrival time (HH:MM). Cannot be used with departAt
        in: query
        name: arriveBy
        type: string
      - default: 3
        description: Maximum number of transfers (0-3)
        in: query
        name: maxTransfers
        type: integer
      - description: Comma-separated railway IDs to avoid
        example: odpt.Railway:Toei.Oedo
        in: query
        name: avoid
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.JourneySearch'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Search journeys
      tags:
      - Journey
  /api/routes:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/service.Railway'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get railways
      tags:
      - Railway
  /api/routes/{routeId}/stations:
    get:
      parameters:
      - description: Route ID
        example: odpt.Railway:Toei.Asakusa
        in: path
        name: routeId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/service.Station'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get stations by route
      tags:
      - Station
  /api/stations/{stationId}:
    get:
      parameters:
      - description: Station ID
        example: odpt.Station:Toei.Asakusa.Shimbashi
        in: path
        name: stationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.StationDetail'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get station detail
      tags:
      - Station
  /api/status:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/service.TrainStatus'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Train Status
      tags:
      - Status
  /api/trains/{trainId}/location:
    get:
      parameters:
      - description: Train ID
        example: odpt.Train:Toei.Mita.1740T
        in: path
        name: trainId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.TrainLocation'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get train location
      tags:
      - Train
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health Check
      tags:
      - Health
swagger: "2.0"
